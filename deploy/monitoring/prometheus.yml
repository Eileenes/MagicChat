global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: magicchat-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - server:20080

  - job_name: magicchat-push-gateway
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - push.jiying.chat:443
